services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: knowflow
      MYSQL_USER: knowflow
      MYSQL_PASSWORD: knowflow_dev
      MYSQL_ROOT_PASSWORD: root_dev
    ports: ["28006:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
  redis:
    image: redis:7-alpine
    ports: ["26379:6379"]
  qdrant:
    image: qdrant/qdrant:v1.15.3
    ports: ["6333:6333"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: knowflow
      MINIO_ROOT_PASSWORD: knowflow_dev
    ports: ["29000:9000", "29001:9001"]
volumes:
  mysql_data:
