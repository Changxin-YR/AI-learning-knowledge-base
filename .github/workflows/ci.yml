name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    env:
      APP_ENV: test
      SQLITE_PATH: /tmp/knowflow-ci.db
      JWT_SECRET: ci-only-secret-that-is-never-used-in-production
      DEMO_AI_MODE: "1"
      RAG_MODE: lexical
      EMBEDDING_PROVIDER: local
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest -q

      - name: Run deterministic RAG evaluation
        working-directory: .
        run: python scripts/rag-eval.py --output artifacts/rag-eval/ci.json

      - name: Upload RAG evaluation
        uses: actions/upload-artifact@v7
        with:
          name: rag-evaluation
          path: artifacts/rag-eval/ci.json
          if-no-files-found: error
          retention-days: 30

  flutter:
    name: Flutter / analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.4
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run widget tests
        run: flutter test
